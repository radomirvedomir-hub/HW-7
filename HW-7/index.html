<h1>Рецепт улюбленого салату</h1>

<ol start="6">
        <li>Нарізати свіжі огірки та помідори середніми шматочками.</li>
     <li>Додати дрібно нарізану зелень та болгарський перець.</li>
        <li>Заправити оливковою олією, додати сіль та перець за смаком.</li>
        <li>Обережно все перемішати та подавати до столу.</li>
</ol>
